name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install shellcheck (pinned)
        run: |
          set -euo pipefail
          SC_VERSION="v$(sed -n 's/^SHELLCHECK_VERSION=//p' scripts/check.sh)"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SC_VERSION}/shellcheck-${SC_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-${SC_VERSION}" >> "$GITHUB_PATH"

      - name: Clone workbench-dev-team outside the workspace for its git-commit references
        run: git clone --depth 1 --quiet https://github.com/mike-bronner/workbench-dev-team.git "$RUNNER_TEMP/workbench-dev-team"

      - name: scripts/check.sh
        env:
          WORKBENCH_DEV_TEAM_DIR: ${{ runner.temp }}/workbench-dev-team
        run: scripts/check.sh
