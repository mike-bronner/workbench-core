name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: plugin.json — valid JSON, required fields, semver version
        run: |
          set -euo pipefail
          f=.claude-plugin/plugin.json
          jq empty "$f"
          for field in name version description author; do
            jq -e ".${field}" "$f" > /dev/null \
              || { echo "::error file=${f}::missing required field: ${field}"; exit 1; }
          done
          version=$(jq -r '.version' "$f")
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error file=${f}::version '$version' is not semver"
            exit 1
          fi

      - name: MCP tool-name refs match plugin + server names in plugin.json
        run: |
          set -euo pipefail
          plugin_name=$(jq -r '.name' .claude-plugin/plugin.json)
          # For every MCP server declared in plugin.json, the tool prefix must be
          # mcp__plugin_<plugin_name>_<server_name>__<tool>. Any reference that
          # doesn't match is stale (usually from a plugin or server rename).
          mapfile -t servers < <(jq -r '.mcpServers // {} | keys[]' .claude-plugin/plugin.json)
          fail=0
          # Collect every mcp__plugin_ reference from sources.
          mapfile -t refs < <(grep -rhoE 'mcp__plugin_[A-Za-z0-9_-]+__[A-Za-z0-9_]+' \
            --include='*.md' --include='*.sh' --include='*.json' \
            agents hooks references skills assets 2>/dev/null | sort -u)
          for ref in "${refs[@]}"; do
            # Strip the trailing __<tool> to get mcp__plugin_<name>_<server>
            prefix="${ref%__*}"
            # Strip leading mcp__plugin_ to get <name>_<server>
            body="${prefix#mcp__plugin_}"
            matched=0
            for server in "${servers[@]}"; do
              if [ "$body" = "${plugin_name}_${server}" ]; then
                matched=1
                break
              fi
            done
            if [ "$matched" -eq 0 ]; then
              echo "::error::stale MCP tool ref: ${ref} (expected prefix for plugin '${plugin_name}', servers: ${servers[*]})"
              fail=1
            fi
          done
          exit "$fail"

      - name: shellcheck every tracked shell file
        run: |
          set -euo pipefail
          # PINNED. The runner image's shellcheck floats, and a developer's local
          # copy does not track it: 0.11.0 does not raise SC2120 where the image's
          # older build does, so main sat red across 0.19.0-0.19.3 while every
          # local run reported clean. A lint gate that disagrees with the machine
          # people actually run it on is not a gate. Bump this deliberately.
          SC_VERSION=v0.11.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SC_VERSION}/shellcheck-${SC_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - -C /tmp
          SHELLCHECK="/tmp/shellcheck-${SC_VERSION}/shellcheck"
          "$SHELLCHECK" --version
          # Every tracked shell file, not a hand-listed set of directories. A
          # directory the list forgets is linted by nothing, and nothing says so.
          # Tracked only, so an untracked scratch copy is not ours to gate on.
          # The pathspec is quoted so git expands it, not the shell. Unquoted, a
          # top-level *.sh would shrink the pathspec to that one file.
          mapfile -t scripts < <(git ls-files '*.sh')
          printf '%s\n' "${scripts[@]}"
          # -x lets shellcheck follow `source`d libraries under hooks/lib.
          "$SHELLCHECK" --severity=warning -x "${scripts[@]}"

      - name: bash -n on every tracked shell file
        run: |
          set -euo pipefail
          # Tracked files, quoted pathspec: same rule as the shellcheck step above.
          mapfile -t scripts < <(git ls-files '*.sh')
          for f in "${scripts[@]}"; do
            bash -n "$f"
          done

      - name: hook test suite (offline; fake-server fixture, no real server)
        run: |
          set -euo pipefail
          fail=0
          for t in hooks/test-*.sh; do
            echo "::group::$t"
            if bash "$t"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=${t}::test suite failed"
              fail=1
            fi
          done
          exit "$fail"

      - name: Frontmatter present on skills and agents
        run: |
          set -euo pipefail
          fail=0
          for f in skills/*/SKILL.md agents/*.md; do
            [ -f "$f" ] || continue
            if ! head -1 "$f" | grep -qx -- '---'; then
              echo "::error file=${f}::missing opening frontmatter"
              fail=1
              continue
            fi
            if ! awk 'NR>1 && /^---$/ {print NR; exit}' "$f" | grep -qE '^[0-9]+$'; then
              echo "::error file=${f}::missing closing frontmatter"
              fail=1
              continue
            fi
            fm=$(awk 'NR==1&&/^---$/ {on=1; next} on && /^---$/ {exit} on' "$f")
            if ! echo "$fm" | grep -qE '^description:'; then
              echo "::error file=${f}::frontmatter missing required field: description"
              fail=1
            fi
          done
          exit "$fail"

      - name: CLAUDE_PLUGIN_ROOT references resolve
        run: |
          set -euo pipefail
          fail=0
          # Strip a trailing dot from each match: prose and comments often end a
          # sentence right after a path ("see ${CLAUDE_PLUGIN_ROOT}/hooks/x.sh."),
          # and the char class above would otherwise fold that period into the
          # path and report a spurious broken reference. No plugin path legitimately
          # ends in a dot, so this is safe.
          mapfile -t refs < <(grep -rhoE '\$\{CLAUDE_PLUGIN_ROOT\}/[A-Za-z0-9_./-]+' \
            --include='*.md' --include='*.sh' \
            agents hooks references skills assets 2>/dev/null \
            | sed 's|${CLAUDE_PLUGIN_ROOT}/||; s|[.]*$||' \
            | sort -u)
          for r in "${refs[@]}"; do
            if [ ! -e "$r" ]; then
              echo "::error::broken reference: \${CLAUDE_PLUGIN_ROOT}/$r"
              fail=1
            fi
          done
          exit "$fail"

  # The hooks module's tests (tests/*.test.ts) and the manifest check. Both run
  # in the Claude Code CLI's own test kit and need no account: measured
  # 2026-10-07 with the npm package of this version, under `env -i` with an
  # empty HOME and CLAUDE_CONFIG_DIR, 859 tests passed and validate passed.
  # PINNED, like shellcheck above: the mods API moves between releases, and a
  # floating CLI would turn this job red with no change here. Bump it
  # deliberately. The type-check needs the engine's types, which the CLI lays
  # into .claude-plugin/types/ only when a session loads the plugin. A headless
  # session with no account still loads it before it stops at the login check,
  # so the type-check step starts one for that and nothing else.
  plugin-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # PINNED with the CLI: @anthropic-ai/claude-code 2.1.292 declares
      # engines.node ">=22.0.0", and the runner image's default Node floats.
      # Bump the two together.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install the Claude Code CLI (pinned)
        run: |
          set -euo pipefail
          CLAUDE_CODE_VERSION=2.1.292
          node --version
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      - name: claude plugin validate
        run: claude plugin validate .

      - name: claude plugin test
        run: claude plugin test .

      # OMITS_CLAUDE_MD (hooks/mods/prompt-rules.ts) mirrors the agents defined
      # with omitClaudeMd, because no hooks-module API says which types set it.
      # It drifted once: Explore and Plan were missing. The check reads the
      # built-ins out of the pinned CLI binary and core's own agents/*.md, and
      # fails on any difference, or when it cannot read the binary's layout.
      - name: OMITS_CLAUDE_MD matches the pinned CLI's omitClaudeMd agents
        run: python3 scripts/omit-claude-md-check.py "$(readlink -f "$(command -v claude)")"

      # The strict type-check: the engine's own tsconfig (strict and
      # noUncheckedIndexedAccess), the same one workbench-dev-team checks
      # against when it re-exports this module. Without it a strict-mode error
      # reached main in 159f51a and was caught only by dev-team.
      - name: TypeScript strict type-check
        run: |
          set -euo pipefail
          # PINNED, like the CLI: a new compiler can add errors with no change
          # here. Bump it deliberately.
          TYPESCRIPT_VERSION=7.0.2
          home="$RUNNER_TEMP/type-home"
          mkdir -p "$home"
          # Lays the types, then exits 1 at the login check. That exit is
          # expected, so only the types it leaves behind are checked.
          HOME="$home" CLAUDE_CONFIG_DIR="$home/.claude" \
            claude -p 'lay the types' --plugin-dir "$PWD" < /dev/null || true
          for t in claude-code claude-code-tools claude-code-mcp; do
            [ -f ".claude-plugin/types/$t/index.d.ts" ] \
              || { echo "::error::the CLI laid no $t types, so the type-check cannot run"; exit 1; }
          done
          npx --yes -p "typescript@${TYPESCRIPT_VERSION}" tsc -p tsconfig.json
